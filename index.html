<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2 года без сигарет</title>
<meta name="description" content="Сундучок на каждый день двух лет без сигарет: вехи здоровья, награды, копилка и журнал тяги. Работает без интернета.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Не курю">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1b17" media="(prefers-color-scheme: dark)">
<style>
  /* ================= Токены ================= */
  :root {
    --bg: #eef5f1; --surface: #ffffff; --surface-2: #e2eee8; --ink: #10302a; --muted: #52706a; --line: #d2e1da;
    --mint: #0b7d58; --mint-ink: #ffffff; --mint-bright: #23b883; --mint-soft: #d4efe3;
    --gold: #e3a21a; --gold-deep: #a8700a; --gold-lid: #f2bf45; --gold-soft: #fbefd2; --gold-ink: #845500;
    --chest-body: var(--gold); --chest-band: var(--gold-deep); --chest-lid: var(--gold-lid); --chest-inside: #4a2e06; --chest-lock: var(--gold-deep);
    --lock-body: #9ab0a6; --scrim: rgb(9 28 23 / .45);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
    --font-display: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    --font-note: ui-serif, "New York", Georgia, "Times New Roman", serif;
    --future-body: #c9d8d0; --future-band: #aabeb4; --future-lid: #d6e3dc; --future-lock: #9ab0a6;
    --tap: 44px; --content: 720px; --tabbar: 58px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1b17; --surface: #142621; --surface-2: #1b322b; --ink: #e4f1eb; --muted: #93aca3; --line: #26433b;
      --mint: #3fd3a0; --mint-ink: #052019; --mint-bright: #3fd3a0; --mint-soft: #15392e;
      --gold: #efb435; --gold-deep: #b97f10; --gold-lid: #f6c95a; --gold-soft: #3a2f14; --gold-ink: #f4c863;
      --chest-inside: #2a1a03; --lock-body: #5f7a71; --scrim: rgb(0 0 0 / .6);
      --future-body: #2c463e; --future-band: #23392f; --future-lid: #36534a; --future-lock: #4b665c;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
      --bg: #0d1b17; --surface: #142621; --surface-2: #1b322b; --ink: #e4f1eb; --muted: #93aca3; --line: #26433b;
      --mint: #3fd3a0; --mint-ink: #052019; --mint-bright: #3fd3a0; --mint-soft: #15392e;
      --gold: #efb435; --gold-deep: #b97f10; --gold-lid: #f6c95a; --gold-soft: #3a2f14; --gold-ink: #f4c863;
      --chest-inside: #2a1a03; --lock-body: #5f7a71; --scrim: rgb(0 0 0 / .6);
      --future-body: #2c463e; --future-band: #23392f; --future-lid: #36534a; --future-lock: #4b665c;
      color-scheme: dark;
  }

  /* ================= База ================= */
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; min-height: 100dvh;
    background: var(--bg); color: var(--ink);
    font: 17px/1.45 var(--font);
    -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation; overscroll-behavior-y: none;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  input, select, textarea { font-size: max(16px, 1em); }
  button { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--mint-bright); outline-offset: 2px; }
  [hidden] { display: none !important; }
  h1, h2, h3, p { margin: 0; }
  .num { font-family: var(--font-display); font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  .small { font-size: 15px; }
  .tiny { font-size: 13px; }

  .btn {
    min-height: var(--tap); padding: 0 18px; border: 0; border-radius: 14px;
    background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line);
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 16px;
    text-decoration: none;
  }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--mint); color: var(--mint-ink); box-shadow: none; }
  .btn.gold { background: var(--gold); color: #2b1a00; box-shadow: none; }
  .btn.ghost { background: transparent; box-shadow: none; color: var(--mint); }
  .btn.quiet { color: var(--muted); }
  .btn.wide { width: 100%; }
  .btn.big { min-height: 56px; font-size: 18px; border-radius: 18px; }
  .btn.icon { padding: 0; width: var(--tap); font-size: 20px; }
  .btn:disabled { opacity: .45; transform: none; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .row > .grow { flex: 1 1 auto; }
  .stack { display: grid; gap: 10px; }

  .field {
    min-height: var(--tap); width: 100%; padding: 10px 14px;
    border: 1px solid var(--line); border-radius: 12px; background: var(--surface);
  }
  .field:focus { outline: 2px solid var(--mint-bright); outline-offset: 1px; }
  label.lbl { display: grid; gap: 6px; font-size: 15px; color: var(--muted); }
  label.lbl > span b { color: var(--ink); font-weight: 600; }
  textarea.field { min-height: 80px; resize: vertical; }

  .chip {
    min-height: 40px; padding: 0 14px; border-radius: 999px; border: 0;
    background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); font-size: 15px; font-weight: 500;
  }
  .chip[aria-pressed="true"] { background: var(--mint); color: var(--mint-ink); box-shadow: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }

  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; background: var(--surface-2); border-radius: 14px; }
  .seg button { min-height: 40px; border: 0; border-radius: 10px; background: transparent; font-weight: 600; font-size: 15px; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }

  .bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 99px; background: var(--mint-bright); min-width: 4px; }
  .bar.gold > i { background: var(--gold); }

  .banner {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin: 0 0 14px; padding: 12px 14px; border-radius: 16px;
    background: var(--mint-soft); color: var(--ink);
  }
  .banner p { flex: 1 1 220px; font-size: 15px; }

  .toast {
    position: fixed; left: 50%; transform: translate(-50%, 8px);
    bottom: calc(var(--tabbar) + 84px + env(safe-area-inset-bottom));
    padding: 12px 18px; border-radius: 16px; background: var(--ink); color: var(--bg);
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 60; max-width: min(90vw, 420px); text-align: center; font-size: 15px;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ================= Экран приветствия и мастер ================= */
  .screen {
    min-height: 100vh; min-height: 100dvh;
    padding: calc(24px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
    display: flex; flex-direction: column;
  }
  .welcome { justify-content: center; align-items: center; text-align: center; gap: 22px; max-width: 520px; margin: 0 auto; }
  .welcome .hero-chest { width: min(260px, 70vw); filter: drop-shadow(0 18px 30px rgb(227 162 26 / .28)); }
  .welcome h1 { font-family: var(--font-display); font-size: clamp(34px, 9vw, 46px); line-height: 1.05; letter-spacing: -0.02em; }
  .welcome p { color: var(--muted); max-width: 30em; }
  .welcome .btn { width: min(100%, 360px); }

  .wizard { max-width: 560px; margin: 0 auto; width: 100%; gap: 18px; }
  .wz-top { display: flex; align-items: center; gap: 12px; }
  .wz-steps { display: flex; gap: 6px; flex: 1; }
  .wz-steps i { flex: 1; height: 6px; border-radius: 9px; background: var(--surface-2); }
  .wz-steps i.on { background: var(--mint-bright); }
  .wz-count { font-size: 14px; color: var(--muted); white-space: nowrap; }
  .wizard h1 { font-family: var(--font-display); font-size: 30px; line-height: 1.1; letter-spacing: -0.01em; }
  .wizard .lead { color: var(--muted); }
  .wz-body { display: grid; gap: 16px; align-content: start; flex: 1; }
  .wz-nav { display: flex; gap: 10px; position: sticky; bottom: 0; padding: 20px 0 calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(to bottom, transparent, var(--bg) 40%); }
  .wz-nav .btn { flex: 1; }
  .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
  .reward-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .reward-list li { display: flex; gap: 8px; align-items: center; }
  .reward-list .field { flex: 1; }
  .note { padding: 12px 14px; border-radius: 14px; background: var(--gold-soft); color: var(--ink); font-size: 15px; }
  .summary { display: grid; gap: 2px; padding: 4px 0; }
  .summary div { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .summary div:last-child { border-bottom: 0; }
  .summary dt { color: var(--muted); }
  .summary dd { margin: 0; font-weight: 600; text-align: right; }

  /* ================= Основной экран ================= */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 10px;
    padding: calc(8px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 8px calc(16px + env(safe-area-inset-left));
    background: var(--bg);
    background: color-mix(in srgb, var(--bg) 86%, transparent);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  }
  .topbar h1 { flex: 1; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
  .topbar .btn.icon { background: transparent; box-shadow: none; color: var(--muted); }
  main#view {
    width: 100%; max-width: calc(var(--content) + 40px); margin: 0 auto;
    padding: 4px calc(16px + env(safe-area-inset-right)) calc(var(--tabbar) + 96px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
  }
  .sec { margin-top: 28px; }
  .sec > h2 { font-size: 20px; font-weight: 700; margin-bottom: 12px; letter-spacing: -0.01em; }
  .sec > h2 + .muted { margin: -6px 0 12px; font-size: 15px; }
  .panel { background: var(--surface); border-radius: 20px; padding: 16px; }

  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    display: grid; grid-template-columns: repeat(4, 1fr);
    padding: 4px calc(6px + env(safe-area-inset-right)) env(safe-area-inset-bottom) calc(6px + env(safe-area-inset-left));
    background: var(--surface);
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border-top: 1px solid var(--line);
  }
  .tabbar button {
    min-height: var(--tabbar); border: 0; background: transparent; color: var(--muted);
    display: grid; justify-items: center; align-content: center; gap: 2px; font-size: 11px; font-weight: 600;
  }
  .tabbar svg { width: 26px; height: 26px; }
  .tabbar button[aria-current="page"] { color: var(--mint); }
  .fab {
    position: fixed; z-index: 31; left: 50%; transform: translateX(-50%);
    bottom: calc(var(--tabbar) + 14px + env(safe-area-inset-bottom));
    min-height: 52px; padding: 0 26px 0 20px; border: 0; border-radius: 999px;
    background: var(--ink); color: var(--bg); font-weight: 700; font-size: 17px;
    display: inline-flex; align-items: center; gap: 10px; white-space: nowrap;
    box-shadow: 0 10px 24px rgb(7 30 24 / .28);
  }
  .fab:active { transform: translateX(-50%) scale(.96); }
  .fab svg { width: 22px; height: 22px; }

  /* ---------- Сундучки: шапка ---------- */
  .daystat { padding: 8px 0 4px; display: grid; gap: 10px; }
  .daystat .dayline { display: flex; align-items: baseline; gap: 10px; }
  .daystat .dayline .lbl { font-size: 17px; color: var(--muted); font-weight: 600; }
  .daystat .dayline .big { font-family: var(--font-display); font-size: 64px; line-height: .9; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .daystat .dayline .of { font-family: var(--font-display); font-size: 20px; color: var(--muted); font-weight: 600; }
  .daystat .timer { font-size: 16px; color: var(--muted); }
  .daystat .timer b { color: var(--ink); font-family: var(--font-display); font-size: 19px; font-variant-numeric: tabular-nums; }
  .savings { display: flex; gap: 22px; flex-wrap: wrap; font-size: 15px; color: var(--muted); }
  .savings b { display: block; font-family: var(--font-display); font-size: 24px; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1.15; }

  /* ---------- Сундучки: сегодня ---------- */
  .hero-today {
    margin-top: 18px; display: grid; justify-items: center; text-align: center; gap: 12px;
    padding: 22px 16px 20px; border-radius: 26px;
    background: radial-gradient(120% 80% at 50% 30%, color-mix(in srgb, var(--gold) 22%, var(--surface)) 0%, var(--surface) 70%);
  }
  .hero-today .chest-svg { width: min(210px, 56vw); cursor: pointer; }
  .hero-today h2 { font-family: var(--font-display); font-size: 24px; letter-spacing: -0.01em; }
  .hero-today .btn { min-width: 240px; }
  .hero-today.opened { justify-items: stretch; text-align: left; background: var(--surface); }
  .hero-today.opened .peek { font-family: var(--font-note); font-size: 19px; line-height: 1.5; }
  .hero-today.opened .peek-top { display: flex; align-items: center; gap: 12px; }
  .hero-today.opened .peek-top svg { width: 56px; flex: none; }

  /* ---------- Календарь ---------- */
  .cal-head { display: flex; align-items: center; gap: 4px; margin: 26px 0 10px; }
  .cal-head h2 { flex: 1; font-size: 20px; font-weight: 700; text-align: center; }
  .cal-head .btn.icon { background: transparent; box-shadow: none; font-size: 26px; color: var(--ink); }
  .cal-head .btn.icon:disabled { opacity: .25; }
  .cal-tools { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 14px; color: var(--muted); }
  .cal-tools .btn { min-height: 36px; font-size: 14px; padding: 0 12px; }
  .wk, .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .wk span { text-align: center; font-size: 12px; color: var(--muted); font-weight: 600; padding-bottom: 4px; }
  .cell {
    position: relative; aspect-ratio: 1 / 1.08; min-height: 44px; border: 0; padding: 0; border-radius: 12px;
    background: var(--surface); display: grid; place-items: center;
  }
  .cell .dn { position: absolute; left: 6px; top: 4px; font-size: 11px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .cell svg.mini { width: 70%; margin-top: 10%; }
  .cell.out { background: transparent; color: var(--line); pointer-events: none; }
  .cell.out .dn { color: var(--line); }
  .cell.future { --chest-body: var(--future-body); --chest-band: var(--future-band); --chest-lid: var(--future-lid); --chest-lock: var(--future-lock); }
  .cell.future svg.mini { opacity: .9; }
  .cell.today { box-shadow: 0 0 0 2px var(--gold), 0 6px 18px rgb(227 162 26 / .35); background: var(--gold-soft); }
  .cell.today .dn { color: var(--gold-ink); }
  .cell.missed::after { content: ""; position: absolute; right: 6px; top: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }
  .cell.sel { box-shadow: 0 0 0 2px var(--mint); }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 12px; font-size: 13px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend svg { width: 22px; }

  .layout { display: block; }
  .side { display: none; }

  /* ---------- Карточка дня ---------- */
  .daycard { display: grid; gap: 14px; }
  .dc-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .dc-day { font-family: var(--font-display); font-size: 28px; font-weight: 700; letter-spacing: -0.01em; }
  .dc-date { color: var(--muted); font-size: 15px; }
  .dc-kind { display: inline-block; justify-self: start; padding: 4px 10px; border-radius: 99px; background: var(--mint-soft); color: var(--ink); font-size: 13px; font-weight: 600; }
  .dc-kind.k-milestone { background: color-mix(in srgb, var(--mint-bright) 22%, var(--surface)); }
  .dc-kind.k-celebration { background: var(--gold-soft); color: var(--gold-ink); }
  .dc-text { margin: 0; font-family: var(--font-note); font-size: 21px; line-height: 1.5; }
  .dc-src { font-size: 13px; color: var(--muted); margin-top: -6px; }
  .figs { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; margin: 0; }
  .figs div { padding: 10px 12px; border-radius: 14px; background: var(--surface-2); }
  .figs dt { font-size: 13px; color: var(--muted); }
  .figs dd { margin: 0; font-family: var(--font-display); font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .dc-reward {
    display: grid; gap: 10px; padding: 16px; border-radius: 18px;
    background: linear-gradient(160deg, var(--gold-soft), color-mix(in srgb, var(--gold) 30%, var(--gold-soft)));
  }
  .dc-reward .r-lbl { font-size: 14px; font-weight: 700; color: var(--gold-ink); }
  .dc-reward .r-text { font-family: var(--font-display); font-size: 24px; font-weight: 700; line-height: 1.2; }

  /* ================= Диалоги ================= */
  dialog {
    width: min(520px, 100vw); max-width: 100vw; max-height: 92vh; max-height: 92dvh;
    padding: 0; border: 0; border-radius: 24px; background: var(--bg); color: var(--ink);
    overflow: hidden;
  }
  dialog::backdrop { background: var(--scrim); }
  .dlg { display: flex; flex-direction: column; max-height: inherit; }
  .dlg-head { display: flex; align-items: center; gap: 8px; padding: 18px 12px 6px 20px; }
  .dlg-head h2 { flex: 1; font-size: 21px; font-weight: 700; letter-spacing: -0.01em; }
  .dlg-head .btn.icon { background: var(--surface-2); box-shadow: none; width: 36px; min-height: 36px; border-radius: 50%; font-size: 16px; color: var(--muted); }
  .dlg-body { padding: 8px 20px 20px; overflow-y: auto; -webkit-overflow-scrolling: touch; display: grid; gap: 16px; }
  .dlg-foot { padding: 12px 20px calc(16px + env(safe-area-inset-bottom)); display: grid; gap: 8px; border-top: 1px solid var(--line); background: var(--bg); }
  dialog.confirm { width: min(400px, calc(100vw - 32px)); }
  dialog.confirm .dlg-body { padding-top: 22px; font-size: 17px; }
  dialog.confirm .dlg-foot { border-top: 0; padding-bottom: 18px; }
  @media (max-width: 599px) {
    dialog.sheet { margin: auto 0 0; width: 100vw; border-radius: 24px 24px 0 0; }
  }

  /* --- Сундук открывается --- */
  dialog.chest-dlg {
    width: 100vw; height: 100vh; height: 100dvh; max-height: none; max-width: none; margin: 0; border-radius: 0;
    background: var(--bg);
    background: radial-gradient(90% 60% at 50% 22%, color-mix(in srgb, var(--gold) 30%, var(--bg)) 0%, var(--bg) 70%);
  }
  .chest-stage { height: 100%; overflow-y: auto; padding: calc(12px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); }
  .chest-stage .close { position: sticky; top: 0; margin-left: auto; display: flex; z-index: 2; background: var(--surface); box-shadow: none; border-radius: 50%; width: 40px; min-height: 40px; }
  .chest-inner { max-width: 560px; margin: 0 auto; display: grid; gap: 18px; }
  .stage-chest { width: min(230px, 58vw); justify-self: center; margin-top: 64px; overflow: visible; }
  .chest-card { background: var(--surface); border-radius: 24px; padding: 20px; opacity: 0; transform: translateY(14px); transition: opacity .45s ease, transform .45s ease; }
  .chest-card.show { opacity: 1; transform: none; }

  .chest-svg .lid { transform-box: view-box; transform-origin: 16px 54px; transition: transform .55s cubic-bezier(.3,1.4,.5,1); }
  .chest-svg .glow { opacity: 0; transition: opacity .5s ease .15s; }
  .chest-svg.is-open .lid { transform: translate(-4px, -16px) rotate(-24deg); }
  .chest-svg.is-open .glow { opacity: 1; }
  .chest-svg.shake { animation: shake .5s ease-in-out; transform-origin: 50% 90%; }
  @keyframes shake {
    0%, 100% { transform: rotate(0); } 15% { transform: rotate(-5deg); } 30% { transform: rotate(5deg); }
    45% { transform: rotate(-4deg); } 60% { transform: rotate(4deg); } 75% { transform: rotate(-2deg); }
  }
  .wobble { animation: wobble 3.2s ease-in-out infinite; transform-origin: 50% 90%; }
  @keyframes wobble { 0%, 76%, 100% { transform: rotate(0); } 82% { transform: rotate(-4deg); } 88% { transform: rotate(4deg); } 94% { transform: rotate(-2deg); } }
  .cell.today svg.mini { animation: wobble 3.2s ease-in-out infinite; transform-origin: 50% 90%; }

  .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 70; }
  .confetti i { position: absolute; top: -12px; width: 9px; height: 14px; border-radius: 2px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translate3d(var(--dx), 105vh, 0) rotate(var(--rot)); } }

  /* --- SOS --- */
  .breath { display: grid; place-items: center; height: 230px; position: relative; }
  .breath .ring { position: absolute; width: 200px; height: 200px; border-radius: 50%; background: var(--mint-soft); }
  .breath .core {
    width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, var(--mint-bright), var(--mint));
    transform: scale(.55); animation: breathe 14s ease-in-out infinite; opacity: .92;
  }
  .breath .phase { position: absolute; font-family: var(--font-display); font-size: 22px; font-weight: 700; color: var(--mint-ink); }
  @keyframes breathe { 0% { transform: scale(.55); } 28.57% { transform: scale(1); } 57.14% { transform: scale(1); } 100% { transform: scale(.55); } }
  .sos-timer { font-family: var(--font-display); font-size: 44px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }
  .tipbox { padding: 14px 16px; border-radius: 16px; background: var(--surface); }
  .reasons { margin: 0; padding-left: 20px; display: grid; gap: 4px; }

  /* --- Отметка тяги --- */
  .intens { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .intens button { min-height: 46px; border: 0; border-radius: 12px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); font-family: var(--font-display); font-weight: 700; font-size: 18px; }
  .intens button[aria-pressed="true"] { background: var(--ink); color: var(--bg); box-shadow: none; }
  details.more summary { cursor: pointer; color: var(--mint); font-weight: 600; font-size: 15px; min-height: 36px; display: flex; align-items: center; }

  /* ================= Тяга: журнал ================= */
  .j-day { margin-top: 20px; }
  .j-day h3 { font-size: 15px; color: var(--muted); font-weight: 600; margin-bottom: 8px; }
  .j-list { list-style: none; margin: 0; padding: 0; background: var(--surface); border-radius: 18px; overflow: hidden; }
  .j-list li + li { border-top: 1px solid var(--line); }
  .j-item { width: 100%; display: grid; grid-template-columns: 54px 1fr auto; gap: 10px; align-items: center; padding: 12px 14px; border: 0; background: transparent; text-align: left; min-height: 56px; }
  .j-item .t { font-family: var(--font-display); font-weight: 700; font-variant-numeric: tabular-nums; }
  .j-item .what { font-weight: 600; }
  .j-item .note { padding: 0; background: none; font-size: 14px; color: var(--muted); }
  .dots { display: inline-flex; gap: 3px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
  .dots i.on { background: var(--ink); }
  .tag { font-size: 13px; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: var(--mint-soft); white-space: nowrap; }
  .tag.smoked { background: var(--surface-2); color: var(--muted); }
  .empty { padding: 36px 20px; text-align: center; color: var(--muted); display: grid; gap: 12px; justify-items: center; }
  .empty svg { width: 72px; opacity: .8; }
  .sos-cta { display: flex; gap: 14px; align-items: center; padding: 16px; border-radius: 20px; background: var(--surface); }
  .sos-cta p { flex: 1; font-size: 15px; color: var(--muted); }
  .sos-cta p b { display: block; color: var(--ink); font-size: 17px; }

  /* ================= Здоровье ================= */
  .lungs-hero { display: grid; justify-items: center; gap: 12px; padding: 18px 16px; border-radius: 26px; background: var(--surface); text-align: center; }
  .lungs-hero svg { width: min(300px, 80vw); overflow: visible; }
  .lungs-hero .pct { font-family: var(--font-display); font-size: 30px; font-weight: 700; letter-spacing: -0.01em; }
  .lungs-hero .seg { width: min(280px, 100%); }
  .breathing { animation: lungs 4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 40%; }
  @keyframes lungs { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
  .systems { display: grid; gap: 10px; grid-template-columns: 1fr; }
  .sys { background: var(--surface); border-radius: 20px; padding: 14px 16px; display: grid; gap: 8px; }
  .sys h3 { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .sys h3 svg { width: 22px; height: 22px; color: var(--mint); }
  .sys .done { font-size: 15px; }
  .sys .done::before { content: "✓ "; color: var(--mint); font-weight: 700; }
  .sys .next { font-size: 15px; color: var(--muted); }
  .ms-list { list-style: none; margin: 0; padding: 0; background: var(--surface); border-radius: 20px; overflow: hidden; }
  .ms-list li { padding: 14px 16px; display: grid; gap: 8px; }
  .ms-list li + li { border-top: 1px solid var(--line); }
  .ms-top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .ms-when { font-family: var(--font-display); font-weight: 700; white-space: nowrap; }
  .ms-state { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .ms-state.passed { color: var(--mint); font-weight: 600; }
  .ms-title { font-size: 15px; }
  .ms-src { font-size: 12px; color: var(--muted); }
  .disclaimer { font-size: 13px; color: var(--muted); margin-top: 18px; }

  /* ================= Аналитика ================= */
  .kpis { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
  .kpi { background: var(--surface); border-radius: 18px; padding: 14px; display: grid; gap: 2px; align-content: start; }
  .kpi .v { font-family: var(--font-display); font-size: 26px; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .kpi .l { font-size: 14px; color: var(--muted); }
  .kpi .s { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .kpi.wide { grid-column: 1 / -1; }
  @media (max-width: 699px) { .kpi.wide-phone { grid-column: 1 / -1; } }
  .chart { background: var(--surface); border-radius: 20px; padding: 14px 14px 10px; }
  .chart h3 { font-size: 16px; font-weight: 700; margin-bottom: 2px; }
  .chart .sub { font-size: 14px; color: var(--muted); margin-bottom: 10px; }
  .chart svg { width: 100%; height: auto; display: block; overflow: visible; }
  .readout { min-height: 22px; font-size: 14px; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }
  .chart svg text { fill: var(--muted); font-size: 11px; font-family: var(--font); }
  .chart svg .lbl-ink { fill: var(--ink); font-weight: 600; font-size: 12px; }
  [data-tip] { cursor: pointer; }
  .insight { font-family: var(--font-note); font-size: 20px; line-height: 1.45; padding: 16px; border-radius: 20px; background: var(--mint-soft); }
  .ach { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
  .ach div { background: var(--surface); border-radius: 18px; padding: 12px 8px; text-align: center; display: grid; gap: 6px; justify-items: center; align-content: start; }
  .ach svg { width: 46px; height: 46px; }
  .ach b { font-size: 14px; line-height: 1.2; }
  .ach span { font-size: 12px; color: var(--muted); line-height: 1.25; }
  .ach .off svg { filter: grayscale(1); opacity: .35; }
  .ach .off b { color: var(--muted); }
  .history { list-style: none; margin: 0; padding: 0; }
  .history li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .history li:first-child { border-top: 0; }
  .history li .grow { flex: 1; }
  .history .btn { min-height: 36px; padding: 0 10px; font-size: 14px; }

  /* ================= Настройки ================= */
  .set-group { display: grid; gap: 12px; padding: 16px; background: var(--surface); border-radius: 20px; }
  .set-group h3 { font-size: 17px; font-weight: 700; }
  .ver { text-align: center; font-size: 13px; color: var(--muted); padding: 8px; }
  .debug { border: 2px dashed var(--gold); }

  /* ================= Широкий экран (iPad) ================= */
  @media (min-width: 700px) {
    .systems { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  @media (min-width: 960px) and (orientation: landscape) {
    main#view { max-width: 1180px; }
    .layout.chests { display: grid; grid-template-columns: minmax(0, 1fr) minmax(340px, 420px); gap: 28px; align-items: start; }
    .side { display: block; position: sticky; top: calc(64px + env(safe-area-inset-top)); background: var(--surface); border-radius: 24px; padding: 20px; max-height: calc(100dvh - 170px); overflow-y: auto; }
    .layout.chests .hero-today { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
    .chest-card { transition: opacity .3s ease !important; transform: none; }
  }
</style>
</head>

    </button>
    <nav class="tabbar" aria-label="Разделы">
      <button data-tab="chests"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 11V9a6 5 0 0 1 6-5h6a6 5 0 0 1 6 5v2"/><rect x="10" y="9.5" width="4" height="5" rx="1"/></svg>Сундучки</button>
      <button data-tab="journal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2 9c2.5-2.4 4.5-2.4 7 0s4.5 2.4 7 0 4.5-2.4 6 0"/><path d="M2 15c2.5-2.4 4.5-2.4 7 0s4.5 2.4 7 0 4.5-2.4 6 0"/></svg>Тяга</button>
      <button data-tab="health"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v8"/><path d="M12 9c-1 1.5-2.5 2-4 2"/><path d="M12 9c1 1.5 2.5 2 4 2"/><path d="M9 6.5C5 6 3 11 3 15.5 3 19 5 21 7.5 20.5 10 20 10.5 17 10.5 14V9.5"/><path d="M15 6.5c4-.5 6 4.5 6 9 0 3.5-2 5.5-4.5 5-2.5-.5-3-3.5-3-6.5V9.5"/></svg>Здоровье</button>
      <button data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>Аналитика</button>

<script>
'use strict';
/* Тексты сундучков. Формат каждого: { id, type, day?, text, source? }.
   Новые тексты добавляй ТОЛЬКО в конец своих списков: id мотивации, советов и фактов
   берутся по порядку, а план дней хранит id — вставка в середину сдвинет тексты. */
const CONTENT = (() => {
  const out = [];
  const pad3 = (n) => String(n).padStart(3, '0');

  /* ---- Вехи здоровья: день = целое число суток до вехи + 1 ---- */
  [
    [1, 'ms-d1', 'Первый день. Уже через 20 минут после последней сигареты снизились пульс и давление, а к 12 часам уровень угарного газа в крови придёт в норму.', 'ВОЗ'],
    [2, 'ms-d2', 'Сутки без сигарет. Лёгкие начали выводить слизь и остатки дыма, а никотина в крови почти не осталось.', 'NHS, Минздрав Австралии'],
    [3, 'ms-d3', '48 часов: никотин выведен из организма. Вкус и обоняние начинают возвращаться — съешь сегодня что-нибудь ароматное и прислушайся.', 'NHS'],
    [8, 'ms-d8', 'Неделя! Естественная система очистки лёгких начала восстанавливаться, а вкус и запахи становятся ярче.', 'Минздрав Австралии'],
    [15, 'ms-d15', 'Две недели. Начинается период, когда улучшается кровообращение и растёт функция лёгких — подниматься по лестнице становится легче.', 'ВОЗ, NHS'],
    [31, 'ms-d31', 'Месяц без сигарет. С этого момента и примерно до девяти месяцев постепенно уходят кашель и одышка.', 'ВОЗ'],
    [61, 'ms-d61', 'Два месяца. Кровь стала менее густой, руки и ноги снабжаются кровью лучше, иммунитет восстанавливается — организму проще справляться с инфекциями.', 'Минздрав Австралии'],
    [85, 'ms-d85', '12 недель. Позади период, за который заметно улучшаются кровообращение и функция лёгких. Нагрузки даются легче, чем три месяца назад.', 'ВОЗ'],
    [183, 'ms-d183', 'Полгода! Лёгкие работают заметно лучше, мокроты меньше. А ещё через полгода после отказа у большинства стресса меньше, чем было во время курения.', 'Минздрав Австралии'],
    [271, 'ms-d271', 'Девять месяцев. К этому сроку кашель и одышка обычно заметно отступают, а лёгкие продолжают восстанавливаться.', 'ВОЗ'],
    [366, 'ms-d366', 'Год без сигарет! Риск ишемической болезни сердца теперь примерно вдвое ниже, чем если бы ты продолжал курить.', 'ВОЗ']
  ].forEach(([day, id, text, source]) => out.push({ id, type: 'milestone', day, text, source }));

  /* ---- Праздники на круглые дни ---- */
  [
    [10, '10 дней! Самые тяжёлые первые дни позади. Тяга ещё будет приходить, но ты уже знаешь, что она проходит.'],
    [50, '50 дней — это уже не попытка, а новая привычка. Пятьдесят раз подряд ты проснулся и прожил день без сигарет.'],
    [100, '100 дней! Сто раз подряд ты выбрал себя. Загляни в аналитику — там видно, сколько всего уже изменилось.'],
    [200, '200 дней. Когда-то ты считал часы до следующей сигареты, теперь считаешь дни без неё. И их уже двести.'],
    [300, '300 дней. До годовщины чуть больше двух месяцев, а копилка и сигаретная башня растут каждый день.'],
    [365, 'Ровно год с первого дня! Ты прошёл все четыре сезона без сигарет: праздники, отпуск, будни и стрессы. Отметь это как следует.'],
    [500, '500 дней. Если кто-то спросит, как бросить курить, — у тебя уже есть ответ из собственного опыта.'],
    [600, '600 дней. Курение всё больше становится историей из прошлого, а не частью твоего дня.'],
    [700, '700 дней. До финиша один месяц. Подумай, как отметишь двухлетие, — ты это заслужил.'],
    [730, '730 дней — два года без сигарет! Программа пройдена. Впереди этап, когда сильно снижается риск инфаркта и инсульта. Это сделал ты.']
  ].forEach(([day, text]) => out.push({ id: 'cel-' + day, type: 'celebration', day, text }));

/* ---- даты: всё по локальному календарю устройства ---- */
function ymd(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function ymdToUtc(s) { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); }

}
function fmtElapsed(ms) {
  if (ms < HOUR) return `${Math.floor(ms / MIN)} мин`;
  if (ms < 48 * HOUR) { const h = Math.floor(ms / HOUR); return `${h} ${plural(h, 'час', 'часа', 'часов')}`; }

}
function fmtSpan(ms) {
  if (ms < HOUR) { const m = Math.max(1, Math.ceil(ms / MIN)); return `${m} мин`; }

/* ---- случайность: crypto.getRandomValues ---- */
function randInt(min, max) {
  const range = max - min + 1;

}

}

// Дни 1..total делятся на n отрезков; в каждом — случайный день не ближе gap к предыдущему.
function distributeDays(n, total = TOTAL_DAYS, gap = MIN_GAP) {
  const out = [];
  let prev = -Infinity;
  for (let i = 0; i < n; i++) {
    const a = Math.floor((i * total) / n) + 1;
    const b = Math.floor(((i + 1) * total) / n);
    const lo = Math.max(a, prev + gap);
    if (lo > b) throw new Error('Отрезок короче минимального разрыва');
    const d = randInt(lo, b);
    out.push(d);
    prev = d;
  }
  return out;
}
function checkDistribution(daysArr, n, total = TOTAL_DAYS, gap = MIN_GAP) {
  if (daysArr.length !== n) return 'число дней не равно N';
  const sorted = daysArr.slice().sort((a, b) => a - b);
  for (let i = 0; i < sorted.length; i++) {
    if (sorted[i] < 1 || sorted[i] > total) return 'день вне диапазона';
    if (i && sorted[i] === sorted[i - 1]) return 'повтор дня';
    if (i && sorted[i] - sorted[i - 1] < gap) return 'разрыв меньше ' + gap;

}

      let err;
      try { err = checkDistribution(distributeDays(n), n); } catch (e) { err = e.message; }
      if (err) { fails++; firstErr = firstErr || err; }
    }
    report.push({ n, runs, fails, firstErr });
  }
  return { ok: report.every((x) => !x.fails), report };
}

  const plan = Array(TOTAL_DAYS).fill(null);
  for (const t of TEXTS) if (t.type === 'milestone' && t.day <= TOTAL_DAYS) plan[t.day - 1] = t.id;
  for (const t of TEXTS) if (t.type === 'celebration' && t.day <= TOTAL_DAYS && !plan[t.day - 1]) plan[t.day - 1] = t.id;
  const types = ['fact', 'motivation', 'tip'];
  const fresh = () => Object.fromEntries(types.map((tp) => [tp, shuffle(TEXTS.filter((t) => t.type === tp).map((t) => t.id))]));

  for (let i = 0; i < TOTAL_DAYS; i++) {
    if (plan[i]) continue;
    let id = null;
    for (let tries = 0; tries < 3 && !id; tries++) {
      const tp = types[(k + tries) % 3];
      if (pools[tp].length) { id = pools[tp].pop(); k += tries; }
    }
    if (!id) { pools = fresh(); id = pools[types[k % 3]].pop(); }
    k++;
    plan[i] = id;
  }
  return plan;
}

// Вехи до 3 дней после срыва считаются от последней сигареты, остальные — от старта.

  if (el >= m.at) return { state: 'going', pct: el / m.to, left: m.to - el };

const depositFor = (d) => state.bank.deposits.find((x) => x.day === d) || null;
function bankDaysUpTo(t) { const out = []; for (let d = 2; d <= Math.min(t, TOTAL_DAYS); d += 2) out.push(d); return out; }
function pendingBank() { return started() ? bankDaysUpTo(dayNum()).filter((d) => !depositFor(d)) : []; }
function bankStats() {
  const t = Math.min(dayNum(), TOTAL_DAYS);
  const elapsed = bankDaysUpTo(t).length;
  const done = state.bank.deposits.filter((x) => x.status === 'done');
  const actual = done.reduce((s, x) => s + (Number(x.amount) || 0), 0);
  const plan = elapsed * (state.bank.amount || 0);
  const totalPlan = (TOTAL_DAYS / 2) * (state.bank.amount || 0);
  const pct = plan ? actual / plan : 0;
  return { elapsed, actual, plan, pct, totalPlan, forecast: plan ? pct * totalPlan : 0, doneCount: done.length };
}

  sosEnd = Date.now() + 180000;

  for (const v of [1, 3, 5]) s += `<line x1="${left}" x2="${W - right}" y1="${y2(v)}" y2="${y2(v)}" stroke="var(--line)"/><text x="${left - 6}" y="${y2(v) + 4}" text-anchor="end">${v}</text>`;
  s += `<text x="${left}" y="0" class="lbl-ink" dy="0">Отметок за неделю</text><text x="${left}" y="${ch + gapY - 2}" class="lbl-ink">Средняя сила, 1–5</text>`;
  const p1 = data.map((d, i) => `${i ? 'L' : 'M'}${xs(i).toFixed(1)} ${y1(d.n).toFixed(1)}`).join(' ');
  s += `<path d="${p1}" fill="none" stroke="var(--mint)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  let p2 = '', pen = false;
  data.forEach((d, i) => { if (d.a == null) { pen = false; return; } p2 += `${pen ? 'L' : 'M'}${xs(i).toFixed(1)} ${y2(d.a).toFixed(1)} `; pen = true; });
  s += `<path d="${p2}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  const lastI = data.length - 1, last = data[lastI];
  s += `<circle cx="${xs(lastI)}" cy="${y1(last.n)}" r="4.5" fill="var(--mint)" stroke="var(--surface)" stroke-width="2"/>`;
  if (last.a != null) s += `<circle cx="${xs(lastI)}" cy="${y2(last.a)}" r="4.5" fill="var(--ink)" stroke="var(--surface)" stroke-width="2"/>`;
  const colW = data.length > 1 ? (W - left - right) / (data.length - 1) : W - left - right;
  data.forEach((d, i) => {
    s += `<rect x="${(xs(i) - colW / 2).toFixed(1)}" y="0" width="${colW.toFixed(1)}" height="${H - 18}" fill="transparent" data-tip="Неделя ${d.i}: ${d.n} ${plural(d.n, 'отметка', 'отметки', 'отметок')}${d.a != null ? ', средняя сила ' + fmt1(d.a) : ''}"/>`;
  });
  const lbls = data.length <= 8 ? data : data.filter((_, i) => i === 0 || i === lastI || i % Math.ceil(data.length / 6) === 0);
  for (const d of lbls) { const i = data.indexOf(d); s += `<text x="${xs(i).toFixed(1)}" y="${base2 + 20}" text-anchor="middle">нед ${d.i}</text>`; }
  return `<svg viewBox="0 -12 ${W} ${H + 12}" width="${W}" height="${H + 12}" role="img" aria-label="Тренд тяги по неделям">${s}</svg>`;
}
function achievementsHtml(f, bs, found) {
  const elapsedD = (nowMs() - quitMs()) / DAY;
  const sorted = state.cravings.slice().sort((a, b) => a.at.localeCompare(b.at));
  let run = 0, bestRun = 0;
  for (const c of sorted) { run = c.outcome === 'smoked' ? 0 : run + 1; bestRun = Math.max(bestRun, run); }
  let chestRun = 0, bestChest = 0;
  for (let d = 1; d <= TOTAL_DAYS; d++) {
    const c = state.chests[d];
    if (c && c.openedAt.slice(0, 10) === dateOfDay(d)) { chestRun++; bestChest = Math.max(bestChest, chestRun); } else chestRun = 0;
  }
  const list = [
    ...[1, 3, 7, 30, 100, 180, 365, 500, 730].map((n) => ({ ok: elapsedD >= n, badge: String(n), title: days(n), cond: 'без сигарет' })),
    { ok: bestRun >= 10, badge: '×10', title: 'Устоял 10 раз', cond: 'подряд отметил «Справился»' },
    { ok: f.notSmoked >= 1000, badge: '1000', title: '1000 сигарет', cond: 'не выкурено' },
    { ok: bs.actual >= 10000, badge: '₽', title: '10\u00a0000\u00a0₽', cond: 'накоплено в копилке' },
    { ok: found >= 10, badge: '★', title: '10 наград', cond: 'найдено в сундуках' },
    { ok: bestChest >= 30, badge: '30', title: 'Без пропусков', cond: '30 сундуков подряд открыты в свой день' }
  ];
  return `<div class="ach">${list.map((a) => `<div class="${a.ok ? '' : 'off'}" aria-label="${esc(a.title)}: ${a.ok ? 'получено' : 'ещё нет'}">
    <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="${a.ok ? 'var(--gold)' : 'var(--surface-2)'}"/><circle cx="24" cy="24" r="17" fill="none" stroke="${a.ok ? '#fff' : 'var(--line)'}" stroke-opacity=".6" stroke-width="1.5"/><text x="24" y="${a.badge.length > 3 ? 28 : 29.5}" text-anchor="middle" font-family="ui-rounded, -apple-system, sans-serif" font-weight="800" font-size="${a.badge.length > 3 ? 11 : a.badge.length > 2 ? 13 : 16}" fill="${a.ok ? '#2b1a00' : 'var(--muted)'}">${esc(a.badge)}</text></svg>
    <b>${esc(a.title)}</b><span>${esc(a.cond)}</span></div>`).join('')}</div>`;
}

function askConfirm(text, ok = 'Да', cancel = 'Отмена') {
  return new Promise((resolve) => {
    const d = $('#dlgc');
    d.innerHTML = `<div class="dlg"><div class="dlg-body"><p>${esc(text)}</p></div><div class="dlg-foot"><button class="btn primary big" data-c="1">${esc(ok)}</button><button class="btn" data-c="0">${esc(cancel)}</button></div></div>`;
    let done = false;
    const finish = (v) => { if (done) return; done = true; if (d.open) d.close(); resolve(v); };
    d.onclick = (e) => { const b = e.target.closest('[data-c]'); if (b) finish(b.dataset.c === '1'); else if (e.target === d) finish(false); };
    d.oncancel = () => finish(false);   // Escape; событие close не слушаем — оно приходит с задержкой и сбило бы следующее окно
    d.showModal();
  });
}

async function exportData() {
  if (IS_PREVIEW) { toast('В превью сохранить файл нельзя — копия работает в установленном приложении'); return; }
  const name = APP_ID + '-backup-' + todayStr() + '.json';
  const prev = state.lastExportAt;
  state.lastExportAt = localIso(Date.now());
  const payload = JSON.stringify({ app: APP_ID, v: SCHEMA_VERSION, exportedAt: new Date().toISOString(), state }, null, 2);
  const file = new File([payload], name, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); save(); backupDismissed = true; renderBanners(); return; }
    catch (e) { if (e.name === 'AbortError') { state.lastExportAt = prev; return; } }
  }
  const url = URL.createObjectURL(file);
  const a = Object.assign(document.createElement('a'), { href: url, download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  save(); backupDismissed = true; renderBanners();
  if ($('#dlg').open && $('#dlgTitle')?.textContent === 'Настройки') refreshSettings();
}
function validBackup(data) {
  return data && data.app === APP_ID && data.state && typeof data.state === 'object' && data.state.program && Array.isArray(data.state.cravings ?? []) && (data.v || 1) <= SCHEMA_VERSION;
}
async function importData(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch (e) { toast('Файл не читается как резервная копия'); return; }
  if (!validBackup(data)) { toast(data && data.v > SCHEMA_VERSION ? 'Копия из более новой версии — сначала обнови приложение' : 'Это не резервная копия этого приложения'); return; }
  if (!(await askConfirm('Заменить текущие данные данными из копии?', 'Заменить'))) return;
  state = migrate({ v: data.v, state: data.state });
  closeDialog('dlg');
  commit();
  toast('Данные восстановлены');
}

function generateDemo() {
  const t = todayStr();
  const start = addDays(t, -59);
  const pr = state.profile;
  if (!pr.cigsPerDay) pr.cigsPerDay = 15;
  if (!pr.packPrice) pr.packPrice = 250;
  if (!pr.reasons.some((x) => x.trim())) pr.reasons = ['Легко подниматься по лестнице', 'Отпуск на сэкономленные деньги', '', '', ''];
  if (!state.rewards.length) state.rewards = REWARD_IDEAS.map((x) => ({ id: uid(), text: x, day: null, redeemedAt: null }));
  P().status = 'active'; P().startDate = start; P().lastCigaretteAt = start + 'T08:30:00'; P().startedAt = start + 'T08:30:00';
  assignRewardDays();
  state.contentPlan = buildContentPlan();
  state.chests = {}; state.bank.deposits = []; state.cravings = [];
  const r = Math.random;
  for (let d = 1; d <= 59; d++) {
    if (r() < 0.88) {
      const late = r() < 0.15 ? Math.min(59, d + 1 + Math.floor(r() * 3)) : d;
      state.chests[d] = { openedAt: addDays(start, late - 1) + 'T0' + (7 + Math.floor(r() * 3)) + ':1' + Math.floor(r() * 6) + ':00', textId: state.contentPlan[d - 1] };
    }
    if (d % 2 === 0) state.bank.deposits.push({ day: d, amount: r() < 0.86 ? state.bank.amount : 0, status: r() < 0.86 ? 'done' : 'skipped', at: addDays(start, d - 1) + 'T20:05:00' });
  }
  state.bank.deposits.forEach((x) => { if (x.status === 'skipped') x.amount = 0; });
  const slots = [[8, 'Кофе или чай'], [9, 'После сна'], [13, 'После еды'], [14, 'После еды'], [11, 'Перерыв на работе'], [16, 'Перерыв на работе'], [18, 'За рулём'], [19, 'После еды'], [21, 'Стресс'], [22, 'Скука'], [20, 'Алкоголь'], [12, 'Разговор по телефону']];
  for (let d = 1; d <= 60; d++) {
    const date = addDays(start, d - 1);
    const wd = (new Date(parseLocal(date)).getDay() + 6) % 7;
    const n = Math.max(0, Math.round(6 * Math.exp(-d / 22) + r() * 1.6 - 0.3));
    for (let k = 0; k < n; k++) {
      let s = slots[Math.floor(r() * slots.length)];
      if (wd < 5 && r() < 0.35) s = r() < 0.5 ? [13, 'После еды'] : [14, 'После еды'];
      if (wd >= 5 && s[1] === 'Перерыв на работе') s = [20, 'Алкоголь'];
      const intensity = clamp(Math.round(4.3 - d / 22 + (r() * 2 - 1)), 1, 5);
      state.cravings.push({ id: uid(), at: `${date}T${pad(s[0])}:${pad(Math.floor(r() * 60))}:00`, trigger: s[1], intensity, outcome: 'resisted', cigs: 0, note: '' });
    }
  }
  for (const [d, h, cigs] of [[12, 21, 1], [33, 22, 2]]) state.cravings.push({ id: uid(), at: `${addDays(start, d - 1)}T${h}:15:00`, trigger: d === 12 ? 'Алкоголь' : 'Стресс', intensity: 5, outcome: 'smoked', cigs, note: '' });
  state.cravings = state.cravings.filter((c) => parseLocal(c.at) <= nowMs());
  state.cravings.sort((a, b) => a.at.localeCompare(b.at));
}

  'month-today'() { state.ui.month = null; state.ui.selectedDay = null; save(); render(); },
  redeem(el) {
    const r = rewardForDay(Number(el.dataset.day)); if (!r) return;
    r.redeemedAt = localIso(nowMs()); save();
    const card = el.closest('.daycard');
    if (card) card.outerHTML = dayCard(Number(el.dataset.day));
    toast('Награда получена. Заслужил!');
    if (!$('#chestDlg').open) render();
  },
  jfilter(el) { state.ui.journalFilter = el.dataset.v; journalLimit = 50; save(); render(); },
  jmore() { journalLimit += 100; render(); },
  lungs(el) { state.ui.lungsView = el.dataset.v; save(); render(); },
  'bank-open'() { const p = pendingBank(); if (p.length) { bankSnoozed = false; showBank(p); } },
  'bank-all'() { const amt = state.bank.amount || 0; pendingBank().forEach((d) => recordDeposit(d, 'done', amt)); closeDialog('dlg'); commit(); toast('Взносы отмечены'); },
  'bank-each'() { bankQueue = pendingBank(); showBankOne(); },
  'bank-skip-all'() { pendingBank().forEach((d) => recordDeposit(d, 'skipped', 0)); closeDialog('dlg'); commit(); },
  'bank-done'() { const d = bankQueue.shift(); recordDeposit(d, 'done', Math.max(0, parseNum($('#bankAmt').value) ?? state.bank.amount)); save(); if (bankQueue.length) showBankOne(); else { closeDialog('dlg'); render(); toast('Отмечено. Копилка растёт'); } },
  'bank-skip'() { const d = bankQueue.shift(); recordDeposit(d, 'skipped', 0); save(); if (bankQueue.length) showBankOne(); else { closeDialog('dlg'); render(); } },
  'bank-later'() { bankSnoozed = true; bankQueue = []; closeDialog('dlg'); },
  'dep-edit'(el) {
    const d = Number(el.dataset.day), x = depositFor(d); if (!x) return;
    openDialog(`<div class="dlg"><div class="dlg-head"><h2 id="dlg2Title">Взнос за день ${d}</h2><button class="btn icon" data-act="close-dlg2" aria-label="Закрыть">✕</button></div>
      <form class="dlg-body" data-form="dep-save" data-day="${d}" autocomplete="off">
        <label class="lbl"><span>Сумма, ₽ (0 — пропущен)</span><input class="field" id="depAmt" inputmode="decimal" value="${esc(x.status === 'done' ? x.amount : 0)}"></label>
        <button class="btn primary big" type="submit">Сохранить</button>
        <button class="btn quiet" type="button" data-act="dep-del" data-day="${d}">Удалить запись</button>
      </form></div>`, 'dlg2');
  },
  async 'dep-del'(el) { const d = Number(el.dataset.day); if (!(await askConfirm('Удалить запись? Взнос снова будет ждать отметки.', 'Удалить'))) return; state.bank.deposits = state.bank.deposits.filter((x) => x.day !== d); closeDialog('dlg2'); commit(); },
  'reward-add'() { openRewardAdd(null); },
  'reward-edit'(el) { openRewardAdd(el.dataset.id); },
  async 'reward-reveal'() { if (await askConfirm('Показать все награды? Сюрприз пропадёт.', 'Показать')) openRewardList(); },
  async 'reward-del'(el) { const id = el.dataset.id; if (!(await askConfirm('Удалить награду? Её день освободится.', 'Удалить'))) return; state.rewards = state.rewards.filter((r) => r.id !== id); save(); closeDialog('dlg2'); render(); toast('Награда удалена'); },
  export() { exportData(); },
  import() { $('#importFile').click(); },
  async restart() {
    if (!(await askConfirm('Начать программу заново с сегодняшнего дня? Календарь, сундучки и копилка начнутся сначала, награды спрячутся заново. Журнал тяги сохранится.', 'Начать заново'))) return;
    if (!(await askConfirm('Точно начать заново? Это нельзя отменить.', 'Да, начать заново'))) return;
    const p = P(); p.startDate = todayStr(); p.lastCigaretteAt = localIso(nowMs()); p.startedAt = localIso(Date.now());
    assignRewardDays(); state.contentPlan = buildContentPlan(); state.chests = {}; state.bank.deposits = []; state.ui.month = null; state.ui.selectedDay = null;
    closeDialog('dlg'); commit(); toast('Новый старт — день 1');
  },
  async wipe() {
    if (!(await askConfirm('Удалить все данные приложения?', 'Удалить'))) return;
    if (!(await askConfirm('Точно удалить всё? Без резервной копии восстановить не получится.', 'Да, удалить всё'))) return;
    const hint = state.ui.hintHidden;
    state = clone(DEFAULT_STATE); state.ui.hintHidden = hint;
    closeDialog('dlg'); commit();
  },
  'ver-tap'() {
    verTaps++;
    if (verTaps >= 7) { verTaps = 0; state.debug.enabled = !state.debug.enabled; save(); refreshSettings(); toast(state.debug.enabled ? 'Режим отладки включён' : 'Режим отладки выключен'); }
  },
  'dbg-shift'(el) { const v = Number(el.dataset.v); state.debug.offsetDays = v ? state.debug.offsetDays + v : 0; bankSnoozed = false; save(); refreshSettings(); render(); },
  async 'dbg-demo'() { if (!(await askConfirm('Заменить данные демо-данными за 60 дней?', 'Заменить'))) return; generateDemo(); save(); closeDialog('dlg'); render(); toast('Демо-данные созданы'); },
  'dbg-test'() {
    const res = runRewardTest(1000);
    $('#dbgOut').innerHTML = (res.ok ? '<b>Тест пройден.</b> ' : '<b>Ошибка!</b> ') + res.report.map((x) => `N=${x.n}: ${x.runs - x.fails}/${x.runs}${x.firstErr ? ' (' + esc(x.firstErr) + ')' : ''}`).join(', ');
  },
  'dbg-off'() { state.debug.enabled = false; state.debug.offsetDays = 0; save(); refreshSettings(); render(); },
  'hide-hint'() { state.ui.hintHidden = true; commit(); },
  'dismiss-backup'() { backupDismissed = true; renderBanners(); },
  'sw-update'() { if (updateWorker) updateWorker.postMessage('skipWaiting'); }
};

function addWizardReward(text) {
  text = String(text || '').trim();
  if (!text) return;
  if (state.rewards.length >= MAX_REWARDS) { toast(`Больше ${MAX_REWARDS} не поместится: между наградами должно быть минимум ${MIN_GAP} дня`); return; }
  state.rewards.push({ id: uid(), text, day: null, redeemedAt: null });
  commit();
  const inp = $('#newReward'); if (inp) inp.focus();
}

document.addEventListener('click', (e) => {
  const tb = e.target.closest('[data-tab]');
  if (tb) { state.ui.tab = tb.dataset.tab; save(); render(); window.scrollTo(0, 0); if (bankDeferred) setTimeout(() => maybeShowBank(true), 500); return; }
  const tip = e.target.closest('[data-tip]');
  if (tip) { const ro = tip.closest('.chart')?.querySelector('.readout'); if (ro) ro.textContent = tip.dataset.tip; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = ACTIONS[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('pointerover', (e) => {
  if (e.pointerType !== 'mouse') return;
  const tip = e.target.closest('[data-tip]');
  if (tip) { const ro = tip.closest('.chart')?.querySelector('.readout'); if (ro) ro.textContent = tip.dataset.tip; }
});
document.addEventListener('submit', (e) => {
  const f = e.target.closest('[data-form]');
  if (!f) return;
  e.preventDefault();
  const kind = f.dataset.form;
  if (kind === 'wz-add-reward') { addWizardReward($('#newReward').value); }
  else if (kind === 'cr-new-trigger') {
    const v = $('#newTrig').value.trim();
    if (!v) return;
    if (!state.triggers.includes(v)) state.triggers.splice(Math.max(0, state.triggers.length - 1), 0, v);
    save(); draft.trigger = v; rerenderCraving();
  } else if (kind === 'reward-save') {
    const text = $('#rwText').value.trim();
    if (!text) return;
    const id = f.dataset.id;
    if (id) { const r = state.rewards.find((x) => x.id === id); if (r) r.text = text; save(); closeDialog('dlg2'); toast('Сохранено'); return; }
    if (state.rewards.length >= MAX_REWARDS) { toast(`Больше ${MAX_REWARDS} наград не поместится`); return; }
    const day = placeReward(text);
    if (!day) { toast('Не нашлось свободного дня: все будущие сундуки слишком близко к другим наградам'); return; }
    state.rewards.push({ id: uid(), text, day, redeemedAt: null });
    save(); closeDialog('dlg2'); toast('Награда спрятана в один из будущих сундуков');
  } else if (kind === 'dep-save') {
    const d = Number(f.dataset.day), amt = Math.max(0, parseNum($('#depAmt').value) ?? 0);
    recordDeposit(d, amt > 0 ? 'done' : 'skipped', amt);
    closeDialog('dlg2'); commit();
  }
});
document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.dataset.reward) {
    const r = state.rewards.find((x) => x.id === el.dataset.reward);
    if (r) { r.text = el.value; save(); }
    return;
  }
  const path = el.dataset.bind;
  if (!path) return;
  let v = el.value;
  const type = el.dataset.type;
  if (type === 'num') v = parseNum(v);
  else if (type === 'datetime') v = v ? (v.length === 16 ? v + ':00' : v) : null;
  else if (type === 'date') v = v || null;
  const parts = path.split('.');
  let o = state;
  for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]];
  o[parts.at(-1)] = v;
  save();
  if (path === 'program.startDate' && v) { const fe = $('#wzFinish'); if (fe) fe.textContent = `Финиш программы — ${dateLong(addDays(v, TOTAL_DAYS - 1), true)}.`; }
  if (path === 'bank.amount') { const fe = $('#wzBankTotal'); if (fe) fe.textContent = `За 2 года — ${TOTAL_DAYS / 2} взносов, ${fmtMoney((TOTAL_DAYS / 2) * (v || 0))}.`; }
  if (path.startsWith('profile.') && (path.endsWith('cigsPerDay') || path.endsWith('packPrice'))) { const er = $('#wzErr'); if (er && state.profile.cigsPerDay > 0 && state.profile.packPrice > 0) er.hidden = true; }
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'importFile') { const f = e.target.files[0]; if (f) importData(f); e.target.value = ''; }
});

/* ---- свайп по календарю ---- */
let swipeX = null, swipeY = null;
document.addEventListener('touchstart', (e) => { if (e.target.closest('#calGrid')) { swipeX = e.touches[0].clientX; swipeY = e.touches[0].clientY; } else swipeX = null; }, { passive: true });
document.addEventListener('touchend', (e) => {
  if (swipeX == null) return;
  const dx = e.changedTouches[0].clientX - swipeX, dy = e.changedTouches[0].clientY - swipeY;
  swipeX = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    const ms = programMonths(), i = ms.indexOf(currentMonth()) + (dx < 0 ? 1 : -1);
    if (ms[i]) { state.ui.month = ms[i]; save(); render(); }
  }
}, { passive: true });

/* ================= Тосты ================= */
let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

/* ================= Таймеры и смена дня ================= */
let lastDay = null;
function tick() {
  if (!started()) return;
  const t = todayStr();
  if (lastDay && t !== lastDay) { lastDay = t; bankSnoozed = false; if (!$$('dialog[open]').length) { render(); maybeShowBank(); } return; }
  lastDay = t;
  const f = figuresAt(nowMs());
  const a = $('#tmr'), b = $('#tmrCigs'), c = $('#tmrMoney');
  if (a) a.textContent = fmtDHM(f.smokeFree);
  if (b) b.textContent = fmtInt(f.notSmoked);
  if (c) c.textContent = fmtMoney(f.money);
}
setInterval(tick, 15000);
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { hiddenAt = Date.now(); return; }
  if (!started()) return;
  if (Date.now() - hiddenAt > 30000) bankSnoozed = false;
  if (!$$('dialog[open]').length) { render(); setTimeout(maybeShowBank, 400); }
});
let resizeT;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (started() && !$('#chestDlg').open) render(); }, 200); });

/* ================= Установка и хранилище ================= */
const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

/* ================= Офлайн и обновления ================= */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').then((reg) => {
    const offer = (w) => { updateWorker = w; if (started()) renderBanners(); };
    if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      if (!w) return;
      w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) offer(w); });
    });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
  }).catch(() => {});
  const hadController = !!navigator.serviceWorker.controller;
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloading) return;
    reloading = true;
    location.reload();
  });
}

/* ================= Старт ================= */
render();
if (started()) { lastDay = todayStr(); setTimeout(maybeShowBank, 600); }

</script>
</body>
</html>
